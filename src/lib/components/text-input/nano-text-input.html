<div class="field">
  @if (label) {
    <label class="field-label" [for]="id">
      {{ label }}
      @if (required) {
        <span class="required-mark" aria-hidden="true">*</span>
      }
    </label>
  }
  <div class="control-wrapper" style="position: relative;">
    <input
      class="control"
      [id]="id"
      [type]="type === 'password' && !showPassword ? 'password' : (type === 'password' ? 'text' : type)"
      [value]="value"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [required]="required"
      [attr.aria-invalid]="error ? 'true' : null"
      [attr.aria-describedby]="error ? id + '-error' : hint ? id + '-hint' : null"
      (input)="onInput($event)"
    />
    @if (type === 'password') {
      <button
        type="button"
        (click)="togglePassword()"
        class="password-toggle-button"
        style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 4px;"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <path d="M9 12a3 3 0 1 0 6 0"></path>
        </svg>
      </button>
    }
  </div>
  @if (error) {
    <span class="field-message field-error" [id]="id + '-error'" role="alert">{{ error }}</span>
  } @else if (hint) {
    <span class="field-message" [id]="id + '-hint'">{{ hint }}</span>
  }
</div>
